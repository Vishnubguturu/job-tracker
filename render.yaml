databases:
  - name: job-tracker-db
    plan: free
    databaseName: vantage
    user: vantage

services:
  - type: web
    name: job-tracker
    runtime: python
    buildCommand: bash render-build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
